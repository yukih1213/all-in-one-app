<body>
  <main class="app">
    <header class="top"><div class="page-title-line"><h1 class="title">習慣</h1><button id="openHabitComposer" class="add-habit-main"><b>＋</b>追加</button></div><div></div><nav class="nav"><a href="task_manager.html">タスク</a><a href="study_time.html">学習時間</a><a href="reports.html">振り返り</a><a href="habit_manager.html">習慣</a></nav></header>
    <section class="panel section-panel">
      <div class="section-title"><div><h2>今週の習慣</h2><p>一週間の記録をまとめて入力できます。</p></div><div class="week-controls"><button id="prevWeek">‹</button><button id="thisWeek">今週</button><span id="weekRange" class="week-range"></span><button id="nextWeek">›</button></div></div>
      <div id="weeklyOverview"></div>
    </section>
    <div class="notion-divider"></div>
    <section class="streak-section"><div class="metric-toggle choice-toggle"><button type="button" data-metric="streak">継続日数</button><button type="button" data-metric="total">総日数</button></div><div id="streakBlocks" class="streak-blocks"></div></section>
    <div class="notion-divider"></div>
    <section class="calendar-view-heading"><div id="calendarViewToggle" class="choice-toggle"><button type="button" data-calendar-view="mini">個別カレンダー</button><button type="button" data-calendar-view="aggregate">総合カレンダー</button></div></section>
    <section id="miniSection" class="mini-section"><div id="miniCalendars" class="mini-calendars"></div></section>
    <div class="notion-divider"></div>
    <section id="archivePanel" class="archive-panel"><div class="section-title"><div><h2>習慣アーカイブ</h2><p>過去の記録は統合カレンダーに残ります。</p></div></div><div id="archiveList" class="archive-list"></div></section>
    <section id="aggregateSection" class="aggregate-section">
      <div class="panel">
      <div class="calendar-toolbar"><div class="month-nav"><button id="prevMonth" aria-label="前の月">‹</button><span id="monthTitle" class="month-title"></span><button id="nextMonth" aria-label="次の月">›</button></div></div>
      <div class="week-labels"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div><div id="calendar" class="calendar"></div>
      </div>
    </section>
  </main>
  <div id="habitDialog" class="overlay"><form class="dialog"><button class="close" type="button" aria-label="閉じる">×</button><h2 id="habitDialogTitle">習慣を追加</h2><label>習慣名<input id="habitName" maxlength="30" placeholder="例：本を10分読む" required></label><label>内容（任意）<textarea id="habitContent" maxlength="500" placeholder="取り組む内容や、自分へのメモを書けます"></textarea></label><label>通知時間（任意）<div class="reminder-row"><input id="habitReminder" type="time"><button id="enableNotifications" class="notification-permission" type="button">通知を許可</button></div><small>時間を空欄にすると、この習慣の通知はオフになります。</small></label><label>色<div id="palette" class="palette"></div></label><div class="dialog-actions"><button id="archiveHabitButton" class="archive-habit" type="button">アーカイブ</button><button id="saveHabitButton" class="save">追加する</button></div></form></div>
  <script>
if(!localStorage.getItem('michikusa-public-blank-v1')){['kanban-tasks-v2','kanban-categories-v1','kanban-reports-v1','study-plus-local-v1','habit-tracker-v1','habit-weekly-order-v1','habit-mini-order-v1'].forEach(k=>localStorage.removeItem(k));localStorage.setItem('michikusa-public-blank-v1','1')}
    const storageKey='habit-tracker-v1',colors=['#ac725e','#d06b64','#ff7537','#ffad46','#42d692','#16a765','#7bd148','#b3dc6c','#fbe983','#92e1c0','#9fe1e7','#9fc6e7','#4986e7','#9a9cff','#b99aff','#f691b2'];
    let state=JSON.parse(localStorage.getItem(storageKey)||'null')||{habits:[],checks:{}},selected=state.habits[0]?.id||'',month=new Date(new Date().getFullYear(),new Date().getMonth(),1),weekStart=startOfWeek(new Date()),selectedColor=colors[6],streakMetric=localStorage.getItem('habit-streak-metric-v1')||'streak',calendarView=localStorage.getItem('habit-calendar-view-v1')||'mini',editingHabitId=null,weeklyOrder=JSON.parse(localStorage.getItem('habit-weekly-order-v1')||'[]'),miniOrder=JSON.parse(localStorage.getItem('habit-mini-order-v1')||'[]'),draggedHabitId='';
    const $=id=>document.getElementById(id);function save(){localStorage.setItem(storageKey,JSON.stringify(state))}function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function checked(id,key){return!!state.checks[id]?.[key]}
    function currentStreak(id){let count=0,gap=0,d=new Date();while(gap<2){if(checked(id,iso(d))){count+=1+(count>0?gap:0);gap=0}else gap++;d.setDate(d.getDate()-1)}return count}function totalDays(id){return Object.values(state.checks[id]||{}).filter(Boolean).length}function longestStreak(id){const dates=Object.keys(state.checks[id]||{}).filter(key=>state.checks[id][key]).sort();let longest=0,current=0,previous=null;dates.forEach(key=>{const date=new Date(key+'T00:00:00'),gap=previous?Math.round((date-previous)/86400000):0;current=previous&&gap<=2?current+gap:1;longest=Math.max(longest,current);previous=date});return longest}
    function startOfWeek(date){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}function isGraceDay(id,key){if(checked(id,key))return false;const d=new Date(key+'T00:00:00'),prev=new Date(d),next=new Date(d);prev.setDate(d.getDate()-1);next.setDate(d.getDate()+1);return checked(id,iso(prev))&&(checked(id,iso(next))||key===iso(new Date()))}function occupied(id,key){return checked(id,key)||isGraceDay(id,key)}
    function playTick(){const sound=new Audio('completion-sound.wav');sound.volume=.65;sound.play().catch(()=>{})}
    function displayStreak(habit){return habit.archived?Number(habit.archivedStreak||0):currentStreak(habit.id)}function toggle(id,key,button){const habit=state.habits.find(h=>h.id===id);if(!habit||habit.archived)return;state.checks[id]=state.checks[id]||{};const willComplete=!state.checks[id][key];state.checks[id][key]=willComplete;save();if(willComplete&&button){playTick();button.classList.remove('check-pop');void button.offsetWidth;button.classList.add('check-pop');button.textContent='✓';button.style.background=habit.color;button.style.borderColor=habit.color;setTimeout(render,180)}else render()}function archiveHabit(id){const habit=state.habits.find(h=>h.id===id);if(!habit)return false;if(!window.confirm('「'+habit.name+'」をアーカイブしますか？\nこれまでの記録はカレンダーに残ります。'))return false;habit.archived=true;habit.archivedAt=iso(new Date());habit.archivedStreak=currentStreak(id);save();render();return true}function restoreHabit(id){const habit=state.habits.find(h=>h.id===id);if(!habit)return;habit.archived=false;delete habit.archivedAt;delete habit.archivedStreak;save();render()}
    function renderArchive(){const archived=state.habits.filter(h=>h.archived);$('archivePanel').classList.toggle('show',archived.length>0);$('archiveList').innerHTML=archived.map(h=>'<div class="archive-item"><span class="habit-dot" style="background:'+h.color+'"></span><strong>'+esc(h.name)+'</strong><span>'+displayStreak(h)+'日</span><button data-restore="'+h.id+'">戻す</button></div>').join('');document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreHabit(b.dataset.restore))}
    function orderedHabits(order){const active=state.habits.filter(h=>!h.archived),rank=new Map(order.map((id,i)=>[id,i]));return active.sort((a,b)=>(rank.has(a.id)?rank.get(a.id):9999)-(rank.has(b.id)?rank.get(b.id):9999)||state.habits.indexOf(a)-state.habits.indexOf(b))}
    function reorderHabit(orderKey,sourceId,targetId){if(!sourceId||!targetId||sourceId===targetId)return;const current=orderedHabits(orderKey==='weekly'?weeklyOrder:miniOrder).map(h=>h.id),from=current.indexOf(sourceId),to=current.indexOf(targetId);if(from<0||to<0)return;current.splice(to,0,current.splice(from,1)[0]);if(orderKey==='weekly'){weeklyOrder=current;localStorage.setItem('habit-weekly-order-v1',JSON.stringify(current));renderWeekly()}else{miniOrder=current;localStorage.setItem('habit-mini-order-v1',JSON.stringify(current));renderMiniCalendars()}}
    function bindHabitDrag(selector,kind){document.querySelectorAll(selector).forEach(el=>{el.ondragstart=e=>{draggedHabitId=el.dataset.dragHabit;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedHabitId)};el.ondragover=e=>{e.preventDefault();if(el.dataset.dragHabit!==draggedHabitId)el.classList.add('drag-over')};el.ondragleave=()=>el.classList.remove('drag-over');el.ondrop=e=>{e.preventDefault();el.classList.remove('drag-over');reorderHabit(kind,draggedHabitId,el.dataset.dragHabit)};el.ondragend=()=>{draggedHabitId='';document.querySelectorAll(selector).forEach(x=>x.classList.remove('dragging','drag-over'))}})}
    function renderWeekly(){const days=Array.from({length:7},(_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d}),end=days[6],jp=['月','火','水','木','金','土','日'],habits=orderedHabits(weeklyOrder),monthLabel=weekStart.getMonth()===end.getMonth()?weekStart.getFullYear()+'年 '+(weekStart.getMonth()+1)+'月':weekStart.getFullYear()+'年 '+(weekStart.getMonth()+1)+'月〜'+(end.getMonth()+1)+'月';$('weekRange').textContent=(weekStart.getMonth()+1)+'/'+weekStart.getDate()+' – '+(end.getMonth()+1)+'/'+end.getDate();if(!habits.length){$('weeklyOverview').innerHTML='<div class="empty-calendar">記録中の習慣はありません。</div>';return}let html='<div class="weekly-month">'+monthLabel+'</div><div class="weekly-scroll"><div class="weekly-grid"><div class="weekly-header"><div class="weekly-label">習慣</div>'+days.map((d,i)=>'<div class="weekly-label weekly-date"><span>'+jp[i]+'</span><strong>'+d.getDate()+'</strong></div>').join('')+'</div>';habits.forEach(h=>{html+='<div class="weekly-row" draggable="true" data-drag-habit="'+h.id+'"><div class="weekly-habit" data-edit-habit="'+h.id+'" title="編集する"><span class="habit-dot" style="background:'+h.color+'"></span><span>'+esc(h.name)+'</span></div>'+days.map(d=>{const key=iso(d),done=checked(h.id,key),grace=isGraceDay(h.id,key);return '<div><button class="weekly-check '+(done?'done ':'' )+(grace?'grace':'')+'" data-habit="'+h.id+'" data-date="'+key+'" style="--habit-color:'+h.color+';'+(done?'background:'+h.color+';border-color:'+h.color:'')+'">'+(done?'✓':grace?'−':'')+'</button></div>'}).join('')+'</div>'});$('weeklyOverview').innerHTML=html+'</div></div>';document.querySelectorAll('.weekly-check').forEach(b=>b.onclick=e=>{e.stopPropagation();toggle(b.dataset.habit,b.dataset.date,b)});document.querySelectorAll('[data-edit-habit]').forEach(b=>b.onclick=()=>openHabitDialog(b.dataset.editHabit));bindHabitDrag('.weekly-row','weekly')}
    function syncChoice(selector,value){document.querySelectorAll(selector).forEach(b=>{const active=b.dataset.metric===value||b.dataset.calendarView===value;b.classList.toggle('active',active);b.style.order=active?'0':'1'})}function renderStreakBlocks(){const metricValue=h=>streakMetric==='total'?totalDays(h.id):currentStreak(h.id),habits=state.habits.filter(h=>!h.archived).sort((a,b)=>metricValue(b)-metricValue(a)),label=streakMetric==='total'?'総日数':'継続日数';syncChoice('[data-metric]',streakMetric);$('streakBlocks').innerHTML=habits.length?habits.map(h=>{const value=metricValue(h);return '<article class="streak-block" style="--habit-color:'+h.color+'"><div class="streak-block-name">'+esc(h.name)+'</div><div class="streak-block-label">'+label+'</div><div class="streak-block-value">'+value+'<small>日</small></div></article>'}).join(''):'<div class="empty-calendar">記録中の習慣はありません。</div>'}
    function miniCells(){const first=new Date(month.getFullYear(),month.getMonth(),1),offset=(first.getDay()+6)%7,lastDay=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),weeks=Math.ceil((offset+lastDay)/7),start=new Date(first);start.setDate(1-offset);return Array.from({length:weeks*7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d})}
    function renderMiniCalendars(){const habits=orderedHabits(miniOrder);if(!habits.length){$('miniCalendars').innerHTML='<div class="empty-calendar">記録中の習慣はありません。</div>';return}const cells=miniCells(),todayKey=iso(new Date());$('miniCalendars').innerHTML=habits.map(h=>{const streak=currentStreak(h.id),days=cells.map(d=>{const key=iso(d),done=checked(h.id,key),grace=isGraceDay(h.id,key);return '<div class="mini-day '+(d.getMonth()!==month.getMonth()?'out':'')+'"><span class="mini-date">'+d.getDate()+'</span><button class="mini-mark '+(done?'done':grace?'grace':'')+'" data-habit="'+h.id+'" data-date="'+key+'" style="--habit-color:'+h.color+';'+(done?'background:'+h.color:'')+'" title="'+(d.getMonth()+1)+'/'+d.getDate()+'"></button></div>'}).join('');return '<article class="mini-calendar-card" draggable="true" data-drag-habit="'+h.id+'" style="--habit-color:'+h.color+'"><div class="mini-head"><div class="mini-name"><span class="habit-dot" style="background:'+h.color+'"></span><span>'+esc(h.name)+'</span></div><button class="mini-today '+(checked(h.id,todayKey)?'done':'')+'" data-mini-today="'+h.id+'" aria-label="今日の記録">'+(checked(h.id,todayKey)?'✓':'+')+'</button></div><div class="mini-meta"><span>現在 <strong>'+streak+'日</strong></span><span>最長 <strong>'+longestStreak(h.id)+'日</strong></span><div class="mini-actions">'+(streak>=30||h.habitualized?'<button class="habitualize-mini" data-habitualize="'+h.id+'">'+(h.habitualized?'習慣化済':'習慣化する')+'</button>':'')+'</div></div><div class="mini-week"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div><div class="mini-grid">'+days+'</div></article>'}).join('');document.querySelectorAll('.mini-mark').forEach(b=>b.onclick=e=>{e.stopPropagation();toggle(b.dataset.habit,b.dataset.date,b)});document.querySelectorAll('[data-mini-today]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggle(b.dataset.miniToday,todayKey,b)});document.querySelectorAll('[data-habitualize]').forEach(b=>b.onclick=e=>{e.stopPropagation();const h=state.habits.find(x=>x.id===b.dataset.habitualize);h.habitualized=!h.habitualized;save();render()});bindHabitDrag('.mini-calendar-card','mini')}
    function renderCalendar(){
      $('monthTitle').textContent=month.getFullYear()+'年 '+(month.getMonth()+1)+'月';const cells=miniCells();
      if(!state.habits.length){$('calendar').innerHTML='<div class="empty-calendar">まだ習慣がありません。</div>';return}
      const visibleByDay=cells.map((d,index)=>{const key=iso(d);return state.habits.map(h=>{const done=checked(h.id,key),grace=isGraceDay(h.id,key);return {h,done,grace,hasRecord:done||grace,index}}).filter(item=>item.hasRecord)}),maxLines=Math.max(1,...visibleByDay.map(items=>items.length));$('calendar').style.setProperty('--habit-count',maxLines);$('calendar').innerHTML=cells.map((d,index)=>{const key=iso(d),same=d.getMonth()===month.getMonth(),tracks=visibleByDay[index].map(({h,done,grace})=>{const prev=index%7!==0&&occupied(h.id,iso(cells[index-1])),next=index%7!==6&&occupied(h.id,iso(cells[index+1]));const shape=!prev&&!next?'solo':!prev?'start':!next?'end':'middle';return '<div class="track-row"><span class="habit-track '+(done?'occupied '+shape:'occupied grace '+shape)+'" style="--habit-color:'+h.color+';'+(done?'background:'+h.color+';':'')+'" title="'+esc(h.name)+(h.archived?'・アーカイブ済':grace?'・1日お休み（継続中）':'')+'">'+(grace?'−':'')+'</span></div>'}).join('');return '<div class="day '+(!same?'out ':'')+(key===iso(new Date())?'today':'')+'"><span class="date">'+d.getDate()+'</span><div class="tracks">'+tracks+'</div></div>'}).join('')

    function renderCalendarView(){$('miniSection').classList.toggle('calendar-view-hidden',calendarView!=='mini');$('aggregateSection').classList.toggle('calendar-view-hidden',calendarView!=='aggregate');syncChoice('[data-calendar-view]',calendarView)}function render(){renderWeekly();renderStreakBlocks();renderMiniCalendars();renderArchive();renderCalendar();renderCalendarView()}function renderPalette(){$('palette').innerHTML=colors.map(c=>'<button type="button" class="color '+(c===selectedColor?'selected':'')+'" data-color="'+c+'" style="background:'+c+'"></button>').join('');document.querySelectorAll('.color').forEach(b=>b.onclick=()=>{selectedColor=b.dataset.color;renderPalette()})}
    function updateNotificationPermission(){const button=$('enableNotifications');if(!('Notification'in window)){button.textContent='通知非対応';button.disabled=true;return}button.disabled=false;button.textContent=Notification.permission==='granted'?'通知ON':Notification.permission==='denied'?'通知ブロック中':'通知を許可';button.classList.toggle('enabled',Notification.permission==='granted')}async function requestHabitNotifications(){if(!('Notification'in window))return;try{if(Notification.permission!=='granted')await Notification.requestPermission()}catch(e){}updateNotificationPermission()}function checkHabitNotifications(){return;if(!('Notification'in window)||Notification.permission!=='granted')return;const now=new Date(),today=iso(now),currentMinutes=now.getHours()*60+now.getMinutes(),sentKey='habit-reminder-sent-v1',sent=JSON.parse(localStorage.getItem(sentKey)||'{}');let changed=false;state.habits.filter(h=>!h.archived&&h.reminderTime&&!checked(h.id,today)).forEach(h=>{const parts=h.reminderTime.split(':').map(Number),reminderMinutes=parts[0]*60+parts[1],delay=currentMinutes-reminderMinutes;if(delay<0||delay>10||sent[h.id]===today)return;try{const notice=new Notification('習慣の時間です',{body:h.content? h.name+'：'+h.content.slice(0,90):h.name+'を始めましょう'});notice.onclick=()=>window.focus();sent[h.id]=today;changed=true}catch(e){}});if(changed)localStorage.setItem(sentKey,JSON.stringify(sent))}function closeHabitDialog(){$('habitDialog').classList.remove('open');editingHabitId=null}function openHabitDialog(id=null){const habit=typeof id==='string'?state.habits.find(h=>h.id===id):null;editingHabitId=habit?.id||null;selectedColor=habit?.color||colors[6];$('habitName').value=habit?.name||'';$('habitContent').value=habit?.content||'';$('habitReminder').value=habit?.reminderTime||'';$('habitDialogTitle').textContent=habit?'習慣を編集':'習慣を追加';$('saveHabitButton').textContent=habit?'保存する':'追加する';$('archiveHabitButton').classList.toggle('show',!!habit);$('habitDialog').classList.add('open');updateNo addEventListener('visibilitychange',()=>{if(!document.hidden)checkHabitNotifications()});render();checkHabitNotifications();
