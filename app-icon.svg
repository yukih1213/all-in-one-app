  <circle cx="256" cy="256" r="117" fill="url(#orb)" filter="url(#orbShadow)"/>
  <ellipse cx="220" cy="207" rx="45" ry="28" fill="#fff" opacity=".31" transform="rotate(-28 220 207)"/>
  <circle cx="198" cy="188" r="12" fill="#fff" opacity=".74"/>
