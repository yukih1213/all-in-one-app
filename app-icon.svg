<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="halo" cx="50%" cy="47%" r="47%">
      <stop offset="0" stop-color="#7bd7ff" stop-opacity=".54"/>
      <stop offset=".42" stop-color="#9de1ff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#dcefff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="35%" cy="26%" r="80%">
      <stop offset="0" stop-color="#e9faff"/>
      <stop offset=".18" stop-color="#9ee8ff"/>
      <stop offset=".52" stop-color="#48b8f3"/>
      <stop offset="1" stop-color="#1475d4"/>
