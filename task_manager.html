<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script type="module" src="persistence_bridge.js?v=7"></script><script defer src="task_ui_fix.js?v=2"></script><title>Tasks | GTD</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--sub:#86868b;--line:#e5e5e7;--blue:#0071e3;--red:#e5484d;--orange:#d9822b;--green:#198754;--shadow:0 12px 32px #1d1d1f0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",Arial,sans-serif}.app{width:min(100%,1200px);margin:auto;padding:44px 22px 70px}.top{display:flex;align-items:end;justify-content:space-between;margin-bottom:26px}.kicker{color:var(--sub);font-size:12px;font-weight:700;letter-spacing:.14em}.title{margin:8px 0 0;font-size:42px;letter-spacing:-.05em}.count{color:var(--sub);font-size:13px}.composer{display:flex;gap:8px;flex-wrap:wrap;padding:9px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:22px}.composer input,.composer select{border:0;outline:0;background:transparent;padding:11px 12px;color:var(--text)}.composer input[name=title]{flex:1;min-width:180px}.composer select{border-left:1px solid var(--line);color:var(--sub)}button{border:0;cursor:pointer}.add{padding:10px 18px;border-radius:12px;background:var(--text);color:white;font-weight:600}.mini{width:38px;padding:0;border:0;background:#f0f0f2;border-radius:10px;color:var(--sub);font-size:18px}.mini:hover{background:#e4e4e7;color:var(--text)}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.lane{min-width:0}.lane-head{display:flex;align-items:center;justify-content:space-between;padding:4px 5px 10px}.lane-title{font-size:14px;font-weight:700}.lane-count{color:var(--sub);font-size:12px}.lane-body{min-height:190px;padding:8px;border-radius:18px;background:#e9e9ec}.lane-body.drop-target{background:#dfeeff}.task{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;background:var(--card);padding:14px;margin-bottom:8px;border-radius:14px;box-shadow:0 2px 8px #1d1d1f09;cursor:grab;transition:box-shadow .18s ease,transform .18s ease,opacity .18s ease}.task:last-child{margin-bottom:0}.task.dragging{opacity:.45}.task.over{transform:translateY(-2px);box-shadow:0 8px 20px #1d1d1f1c}.check{width:19px;height:19px;border:1.5px solid #c7c7cc;border-radius:50%;background:#fff}.check.done{background:var(--blue);border-color:var(--blue);color:#fff}.check.done:after{content:'✓';font-size:12px}.task-title{display:block;line-height:1.45;word-break:break-word}.task-no{display:inline-block;min-width:18px;margin-right:6px;color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}.task.done .task-title{text-decoration:line-through;color:var(--sub)}.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;color:var(--sub);font-size:11px}.category{padding:2px 6px;border-radius:5px;background:#f0f0f2;color:#666}.priority:before{content:'';display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--green)}.priority.medium:before{background:var(--orange)}.priority.high:before{background:var(--red)}.due.overdue{color:var(--red)}.spent{color:var(--text);font-variant-numeric:tabular-nums}.actions{display:flex;align-items:center;gap:1px}.icon{padding:3px 5px;border-radius:7px;background:transparent;color:#aaa;font-size:14px}.icon:hover{background:#f2f2f4;color:var(--text)}.play{color:var(--blue);font-size:13px}.play.stop{color:var(--red)}.empty{padding:30px 12px;text-align:center;color:#a1a1a6;font-size:12px}.empty strong{display:block;color:#777;margin-bottom:5px}.hint{text-align:center;color:#a1a1a6;font-size:12px;margin:18px 0 0}.reports{margin-top:42px;background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.section-title{margin:0 0 14px;font-size:20px}.tabs{display:flex;gap:6px;margin-bottom:12px}.tab{padding:8px 13px;border-radius:10px;background:#f0f0f2;color:var(--sub)}.tab.active{background:var(--text);color:white}.report-editor{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:14px;resize:vertical;font:inherit;outline:none}.report-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.save-report{padding:9px 15px;border-radius:10px;background:var(--blue);color:white}.saved{font-size:12px;color:var(--green)}.calendar-note{margin-top:24px;padding:14px 16px;border-radius:14px;background:#f5f5f7;color:var(--sub);font-size:12px;line-height:1.7}.calendar-note strong{color:var(--text)}@media(max-width:900px){.board{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.board{grid-template-columns:1fr}.lane-body{min-height:80px}.app{padding-top:32px}.title{font-size:36px}}
</style></head>
<body><main class="app"><header class="top"><div><div class="kicker">GTD TASKS</div><h1 class="title">タスク</h1></div><div id="count" class="count"></div></header>
<div id="completionStats" style="display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 22px"><div class="stat" style="padding:10px 14px;background:#fff;border-radius:12px;box-shadow:0 12px 32px #1d1d1f0d;font-size:12px;color:#86868b"><strong id="doneToday" style="display:block;color:#1d1d1f;font-size:20px;line-height:1.1">0</strong>今日完了</div><div class="stat" style="padding:10px 14px;background:#fff;border-radius:12px;box-shadow:0 12px 32px #1d1d1f0d;font-size:12px;color:#86868b"><strong id="doneWeek" style="display:block;color:#1d1d1f;font-size:20px;line-height:1.1">0</strong>今週完了</div><div class="stat" style="padding:10px 14px;background:#fff;border-radius:12px;box-shadow:0 12px 32px #1d1d1f0d;font-size:12px;color:#86868b"><strong id="doneMonth" style="display:block;color:#1d1d1f;font-size:20px;line-height:1.1">0</strong>今月完了</div></div>
<form id="composer" class="composer"><input name="title" required maxlength="100" placeholder="受信箱に新しいタスクを追加" autocomplete="off"><select name="lane" aria-label="レーン"><option value="inbox" selected>受信箱</option><option value="now">今やる</option><option value="next">次にやる</option><option value="later">残り</option><option value="waiting">対応待ち</option><option value="someday">いつか・たぶん</option></select><select id="categoryInput" name="category" aria-label="属性"></select><button id="addCategory" class="mini" type="button" aria-label="属性を追加">＋</button><select name="priority" aria-label="優先度"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select><input name="due" type="date" aria-label="締切"><button class="add">追加</button></form>
<section id="board" class="board"></section><p class="hint">カードをドラッグして、レーンや順番を変えられます</p>
<section class="reports"><h2 class="section-title">振り返り</h2><div class="tabs"><button class="tab active" data-report="daily">日報</button><button class="tab" data-report="weekly">週報</button><button class="tab" data-report="monthly">月報</button></div><label>自己効力感（できたこと・自分の力を感じたこと）<textarea id="selfEfficacy" class="report-editor" style="min-height:90px;margin-top:6px" placeholder="小さなことでも大丈夫です"></textarea></label><label style="display:block;margin-top:14px">自己肯定感（自分を認めてあげたいこと）<textarea id="selfEsteem" class="report-editor" style="min-height:90px;margin-top:6px" placeholder="今日の自分にかけたい言葉"></textarea></label><label style="display:block;margin-top:14px">今日をもう一度やり直せるなら<textarea id="redoToday" class="report-editor" style="min-height:90px;margin-top:6px" placeholder="明日の自分へのヒント"></textarea></label><textarea id="reportEditor" class="report-editor" style="margin-top:14px" placeholder="今日の記録、気づき、次にやることを書きます"></textarea><div class="report-footer"><span id="saved" class="saved"></span><button id="saveReport" class="save-report">保存</button></div><div id="encouragement" style="display:none;margin:18px auto 0;padding:14px 20px;width:max-content;max-width:100%;border-radius:999px;background:#fff0f5;color:#d34d79;font-weight:700;box-shadow:0 8px 24px #d34d7930;animation:popIn .45s ease both">今日も1日頑張ったね！！ 🌷</div><div class="calendar-note"><strong>Googleカレンダー連携について</strong><br>可能です。実際の予定を読み書きするにはGoogleのログイン認証とAPI設定が必要なので、次の段階で連携できます。まずはこの画面でタスクと記録を管理できます。</div></section></main>
<script>
const storage='kanban-tasks-v2',customKey='kanban-categories-v1',reportKey='kanban-reports-v1',labels={inbox:'受信箱',now:'今やる',next:'次にやる',later:'残り',waiting:'対応待ち',someday:'いつか・たぶん'},priorityLabels={low:'低',medium:'中',high:'高'};let customCategories=JSON.parse(localStorage.getItem(customKey)||'[]'),tasks=JSON.parse(localStorage.getItem(storage)||'[]'),reports=JSON.parse(localStorage.getItem(reportKey)||'{}'),currentReport='daily',dragId=null;const lanes=['inbox','now','next','later','waiting','someday'];tasks=tasks.map(t=>({...t,lane:labels[t.lane]?t.lane:'later',category:t.category||'',spent:t.spent||0,running:false,started:0}));const $=s=>document.querySelector(s);function save(){localStorage.setItem(storage,JSON.stringify(tasks))}function saveCategories(){localStorage.setItem(customKey,JSON.stringify(customCategories))}function refreshCategories(){const el=$('#categoryInput');el.innerHTML=[['','属性なし'],...customCategories].map(([id,label])=>`<option value="${id}">${esc(label)}</option>`).join('');el.value=''}function getCategoryLabel(id){return customCategories.find(x=>x[0]===id)?.[1]||''}function date(v){return v?new Date(v+'T00:00:00').toLocaleDateString('ja-JP',{month:'short',day:'numeric'}):''}function time(sec){return `${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor(sec%3600/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}function isLate(t){return t.due&&!t.done&&new Date(t.due+'T23:59:59')<new Date()}
function render(){const board=$('#board');board.innerHTML=lanes.map(l=>{const list=tasks.filter(t=>t.lane===l);return `<section class="lane" data-lane="${l}"><div class="lane-head"><span class="lane-title">${labels[l]}</span><span class="lane-count">${list.length}</span></div><div class="lane-body" data-lane="${l}">${list.length?list.map((t,i)=>card(t,i+1)).join(''):`<div class="empty"><strong>ここは空です</strong>カードを置けます</div>`}</div></section>`}).join('');$('#count').textContent=`未完了 ${tasks.filter(t=>!t.done).length}件 · 合計 ${time(tasks.reduce((n,t)=>n+t.spent+(t.running?Math.floor((Date.now()-t.started)/1000):0),0))}`;bind()}
function card(t,n){const total=t.spent+(t.running?Math.floor((Date.now()-t.started)/1000):0);return `<article class="task ${t.done?'done':''}" draggable="true" data-id="${t.id}"><button class="check ${t.done?'done':''}" aria-label="完了"></button><div><span class="task-title"><span class="task-no">${n}</span>${esc(t.title)}</span><div class="meta"><span class="category">${esc(getCategoryLabel(t.category))}</span><span class="priority ${t.priority}">${priorityLabels[t.priority]}優先</span>${t.due?`<span class="due ${isLate(t)?'overdue':''}">${isLate(t)?'期限切れ · ':''}${date(t.due)}</span>`:''}<span class="spent">⏱ ${time(total)}</span></div></div><div class="actions"><button class="icon play ${t.running?'stop':''}" aria-label="時間計測">${t.running?'■':'▶'}</button><button class="icon edit" aria-label="編集">•••</button><button class="icon remove" aria-label="削除">×</button></div></article>`}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function bind(){document.querySelectorAll('.task').forEach(el=>{const id=+el.dataset.id,t=()=>tasks.find(x=>x.id===id);el.querySelector('.check').onclick=()=>{t().done=!t().done;stop(t());save();render()};el.querySelector('.remove').onclick=()=>{stop(t());tasks=tasks.filter(x=>x.id!==id);save();render()};el.querySelector('.play').onclick=()=>{t().running?stop(t()):start(t());save();render()};el.querySelector('.edit').onclick=()=>{const v=prompt('タスク名',t().title);if(v?.trim()){t().title=v.trim();save();render()}};el.addEventListener('dragstart',()=>{dragId=id;el.classList.add('dragging')});el.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'))});el.addEventListener('dragover',e=>{e.preventDefault();if(id!==dragId)el.classList.add('over')});el.addEventListener('dragleave',()=>el.classList.remove('over'));el.addEventListener('drop',e=>{e.preventDefault();const from=tasks.findIndex(x=>x.id===dragId),to=tasks.findIndex(x=>x.id===id);if(from<0||to<0)return;const moved=tasks.splice(from,1)[0];moved.lane=t().lane;tasks.splice(to,0,moved);save();render()})});document.querySelectorAll('.lane-body').forEach(zone=>{zone.ondragover=e=>{e.preventDefault();zone.classList.add('drop-target')};zone.ondragleave=()=>zone.classList.remove('drop-target');zone.ondrop=e=>{e.preventDefault();if(!dragId)return;const t=tasks.find(x=>x.id===dragId);t.lane=zone.dataset.lane;save();render()}})}function start(t){if(t.running)return;t.running=true;t.started=Date.now()}function stop(t){if(!t.running)return;t.spent+=Math.floor((Date.now()-t.started)/1000);t.running=false;t.started=0}setInterval(()=>{if(tasks.some(t=>t.running))render()},1000);
$('#composer').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);tasks.push({id:Date.now(),title:f.get('title').trim(),lane:f.get('lane'),category:f.get('category'),priority:f.get('priority'),due:f.get('due'),done:false,spent:0,running:false,started:0});save();e.target.reset();e.target.priority.value='medium';e.target.category.value='';render()};$('#addCategory').onclick=()=>{const label=prompt('追加する属性名');if(!label?.trim())return;const id='custom_'+Date.now();customCategories.push([id,label.trim()]);saveCategories();refreshCategories();$('#categoryInput').value=id};function loadReport(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.report===currentReport));$('#reportEditor').value=reports[currentReport]||'';$('#saved').textContent=''}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{currentReport=x.dataset.report;loadReport()});$('#saveReport').onclick=()=>{reports[currentReport]=$('#reportEditor').value;localStorage.setItem(reportKey,JSON.stringify(reports));$('#saved').textContent='保存しました'};refreshCategories();render();loadReport();
</script><script>
function updateCompletionStats(){const now=new Date(),startDay=new Date(now.getFullYear(),now.getMonth(),now.getDate()),startWeek=new Date(startDay);startWeek.setDate(startWeek.getDate()-((startWeek.getDay()+6)%7));const startMonth=new Date(now.getFullYear(),now.getMonth(),1),done=tasks.filter(t=>t.done&&t.completedAt).map(t=>new Date(t.completedAt));$('#doneToday').textContent=done.filter(d=>d>=startDay).length;$('#doneWeek').textContent=done.filter(d=>d>=startWeek).length;$('#doneMonth').textContent=done.filter(d=>d>=startMonth).length}$('#board').addEventListener('click',e=>{if(!e.target.closest('.check'))return;setTimeout(()=>{const id=+e.target.closest('.task').dataset.id,t=tasks.find(x=>x.id===id);if(t){t.completedAt=t.done?Date.now():null;save();updateCompletionStats()}},0)});updateCompletionStats();setInterval(updateCompletionStats,60000);
</script><script>
const reflectionKey='kanban-reflections-v1';let reflections=JSON.parse(localStorage.getItem(reflectionKey)||'{}');const goal=document.createElement('label');goal.style.cssText='display:block;margin-top:14px';goal.innerHTML='明日への一言目標<textarea id="tomorrowGoal" class="report-editor" style="min-height:90px;margin-top:6px" placeholder="明日はこれをやる、を一言で"></textarea>';$('#reportEditor').before(goal);const style=document.createElement('style');style.textContent='@keyframes popIn{0%{opacity:0;transform:translateY(8px) scale(.94)}70%{transform:translateY(-2px) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}';document.head.appendChild(style);function loadReflection(){const r=reflections[currentReport]||{};$('#selfEfficacy').value=r.efficacy||'';$('#selfEsteem').value=r.esteem||'';$('#redoToday').value=r.redo||'';$('#tomorrowGoal').value=r.goal||''}document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>setTimeout(loadReflection,0)));$('#saveReport').addEventListener('click',()=>{reflections[currentReport]={efficacy:$('#selfEfficacy').value,esteem:$('#selfEsteem').value,redo:$('#redoToday').value,goal:$('#tomorrowGoal').value};localStorage.setItem(reflectionKey,JSON.stringify(reflections));const msg=$('#encouragement');msg.style.display='block';msg.style.animation='none';void msg.offsetWidth;msg.style.animation='popIn .45s ease both';setTimeout(()=>msg.style.display='none',4000)});loadReflection();
</script><script>
const memoLabel=document.createElement('label');memoLabel.style.cssText='display:block;margin-top:14px';memoLabel.innerHTML='自由メモ<textarea id="freeMemo" class="report-editor" style="min-height:130px;margin-top:6px" placeholder="今日の記録、気づき、次にやることなど、自由に書けます"></textarea>';$('#reportEditor').replaceWith(memoLabel);const scoreLabel=document.createElement('label');scoreLabel.style.cssText='display:block;margin-top:14px';scoreLabel.innerHTML='今日の点数（10点満点） <select id="dayScore" style="margin-left:8px;padding:7px 10px;border:1px solid #e5e5e7;border-radius:9px;background:#fff;font:inherit"><option value="">未選択</option>'+Array.from({length:11},(_,i)=>`<option value="${i}">${i}点</option>`).join('')+'</select>';memoLabel.after(scoreLabel);const summary=document.createElement('div');summary.id='periodSummary';summary.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0 0';summary.innerHTML='<div style="padding:12px;background:#f5f5f7;border-radius:12px;font-size:12px;color:#86868b"><strong id="weekAvg" style="display:block;color:#1d1d1f;font-size:19px">—</strong>今週の平均点</div><div style="padding:12px;background:#f5f5f7;border-radius:12px;font-size:12px;color:#86868b"><strong id="monthAvg" style="display:block;color:#1d1d1f;font-size:19px">—</strong>今月の平均点</div><div style="padding:12px;background:#f5f5f7;border-radius:12px;font-size:12px;color:#86868b"><strong id="yearAvg" style="display:block;color:#1d1d1f;font-size:19px">—</strong>今年の平均点</div>';scoreLabel.after(summary);function loadScore(){const r=reflections[currentReport]||{};$('#freeMemo').value=r.memo||'';$('#dayScore').value=r.score??'';updatePeriodSummary()}function avg(from){const vals=Object.values(reflections).filter(r=>r.savedAt&&new Date(r.savedAt)>=from&&r.score!==''&&r.score!=null).map(r=>Number(r.score));return vals.length?`${(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)}点（${vals.length}件）`:'—'}function updatePeriodSummary(){const n=new Date(),week=new Date(n);week.setDate(n.get
