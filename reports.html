<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#79b8cf"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="app-icon.svg" type="image/svg+xml">

  <title>日記</title>
  <style>
    :root{--bg:#fbf7ee;--paper:#fffdf8;--ink:#413d36;--sub:#9b9385;--line:#ece3d3;--yellow:#eadcae;--shadow:0 16px 40px #50463217}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",Arial,sans-serif}
    .app{width:min(100%,1200px);margin:auto;padding:44px 22px 70px}.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;margin-bottom:28px}.title{font-size:34px;letter-spacing:-.05em;margin:0}
    .nav{display:flex;gap:7px}.nav a{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 12px;border-radius:10px;color:#36515f;text-decoration:none;font-size:11px;font-weight:500}.nav a:nth-child(1){background:#b9e2f1}.nav a:nth-child(2){background:#c8e6d0}.nav a:nth-child(3){background:#eadcae;color:#6f6244}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:20px}.diary{padding:26px 30px 30px;background:var(--paper);border-radius:22px;box-shadow:var(--shadow);background-image:radial-gradient(#e9dfcf 1px,transparent 1px);background-size:18px 18px}
    .date-row{position:relative;display:grid;place-items:center;min-height:53px;padding-bottom:17px;border-bottom:1px solid var(--line);background:linear-gradient(var(--paper),var(--paper));text-align:center}.date-row>.date-btn{position:absolute;left:0;top:0}.date-title{font-size:21px;font-weight:750}.date-sub{font-size:12px;color:var(--sub);margin-top:4px}.date-btn{width:34px;height:34px;border:0;border-radius:10px;background:#f4ecde;color:#776e60;font-size:20px;cursor:pointer}.date-actions{position:absolute;right:0;top:0;display:flex;align-items:center;gap:6px}.delete-diary{display:none;width:34px;height:34px;padding:0;border:0;border-radius:10px;background:#f8eaea;color:#a85f5f;font-size:15px;cursor:pointer}.delete-diary.show{display:grid;place-items:center}
    .section-label{display:block;margin:23px 0 10px;font-size:12px;color:#8f8778;font-weight:700;letter-spacing:.05em}.moods{display:flex;gap:14px;flex-wrap:wrap;padding:5px 2px;background:linear-gradient(var(--paper),var(--paper))}.mood-choice{display:grid;justify-items:center;gap:6px}.mood{position:relative;width:56px;height:56px;border:2px solid #fff;border-radius:50%;cursor:pointer;box-shadow:0 3px 0 #695d3a19,0 0 0 1px #ffffff80;transition:transform .16s ease,box-shadow .16s ease}.mood:hover{transform:translateY(-2px)}.mood.selected{box-shadow:0 5px 0 #695d3a23,0 0 0 3px #d7b653;transform:translateY(-3px)}.eye{position:absolute;top:21px;width:5px;height:7px;border-radius:50%;background:#554d44}.eye.left{left:18px}.eye.right{right:18px}.mouth{position:absolute;left:50%;top:33px;width:15px;height:8px;transform:translateX(-50%);border:2px solid #554d44;border-top:0;border-radius:0 0 13px 13px}.mood.calm .eye{height:2px;top:25px;border-radius:4px}.mood.calm .mouth{top:32px;height:7px;border-width:0 0 2px;border-radius:0 0 13px 13px}.mood.plain .mouth{top:35px;height:0;border-width:0 0 2px;border-radius:0}.mood.sad .mouth{top:35px;height:7px;border-width:2px 2px 0;border-radius:13px 13px 0 0}.mood.angry .eye{top:22px;width:9px;height:2px;border-radius:2px}.mood.angry .eye.left{left:13px;transform:rotate(18deg)}.mood.angry .eye.right{right:13px;transform:rotate(-18deg)}.mood.angry .mouth{top:36px;height:7px;border-width:2px 2px 0;border-radius:13px 13px 0 0}.mood.spark .mouth{top:32px;width:17px;height:10px;background:#554d44;border:0;border-radius:3px 3px 10px 10px}.blush{position:absolute;top:31px;width:8px;height:4px;border-radius:50%;background:#e78f91aa}.blush.left{left:8px}.blush.right{right:8px}.mood-name{font-size:10px;color:#82796c;white-space:nowrap;font-weight:650}
    .score-picker{display:flex;gap:9px;flex-wrap:wrap;padding:4px 2px 8px}.score-btn{display:grid;place-items:center;width:46px;height:46px;padding:0;border:2px solid #fff;border-radius:15px;background:var(--score-bg);color:#655d50;font:800 16px/1 inherit;cursor:pointer;box-shadow:0 3px 0 #695d3a17,0 0 0 1px #ffffff90;transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}.score-btn:hover{transform:translateY(-2px);filter:saturate(1.08)}.score-btn.selected{transform:translateY(-3px) rotate(-2deg);box-shadow:0 5px 0 #695d3a20,0 0 0 3px #fff,0 0 0 5px #e2bd52}.score-caption{align-self:center;margin-left:4px;color:#9b9385;font-size:11px;font-weight:650}
    .editor{display:block;width:100%;min-height:270px;padding:18px;border:1px solid var(--line);border-radius:15px;background:#fffefa;color:var(--ink);font:inherit;font-size:15px;line-height:1.8;resize:none;overflow:hidden;outline:none}.editor::placeholder{color:#bdb4a4}.save-row{display:flex;align-items:center;justify-content:space-between;margin-top:15px;background:linear-gradient(var(--paper),var(--paper))}.save{padding:10px 17px;border:0;border-radius:10px;background:#514c43;color:#fff;font:inherit;cursor:pointer}.saved{font-size:12px;color:#6d9b77}.diary-cheer{display:none;position:fixed;left:50%;top:50%;z-index:5000;width:max-content;max-width:calc(100vw - 36px);padding:20px 28px;border-radius:999px;background:#fff2c9;color:#7c6740;font-size:clamp(20px,3vw,30px);font-weight:800;text-align:center;box-shadow:0 18px 55px #6c56253b}.diary-cheer.show{display:block;animation:diaryCheer .55s cubic-bezier(.2,.9,.25,1.25) both}@keyframes diaryCheer{0%{opacity:0;transform:translate(-50%,-40%) scale(.82)}65%{transform:translate(-50%,-52%) scale(1.05)}100%{opacity:1;transform:translate(-50%,-50%)}}
    .side{display:grid;gap:16px;align-content:start}.card{padding:19px;background:var(--paper);border-radius:20px;box-shadow:var(--shadow)}.card-title{margin:0 0 13px;font-size:15px}.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:700}.month-nav button{border:0;background:transparent;font-size:18px;color:#766e60;cursor:pointer}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;color:#aaa191;font-size:10px;text-align:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px}.day{position:relative;aspect-ratio:1;padding:0;border:0;border-radius:50%;background:transparent;color:#756d61;font-size:10px;cursor:pointer}.day:hover{box-shadow:0 4px 12px #695d3a16}.day.today{border-radius:10px;background:#fff7dc;box-shadow:inset 0 0 0 1px #e0c779}.day.has-entry{color:#514b43;font-weight:700}.day-number{position:absolute;top:1px;left:3px;z-index:3;font-size:8px}.calendar-face-wrap{position:absolute;left:50%;top:50%;width:32px;height:32px;transform:translate(-50%,-43%);pointer-events:none}.calendar-face-wrap .mood{position:absolute;left:0;top:0;width:56px;height:56px;transform:scale(.57);transform-origin:top left;box-shadow:0 3px 0 #695d3a19,0 0 0 1px #ffffff80}.hint{font-size:12px;line-height:1.7;color:var(--sub)}.export-divider{height:1px;margin:16px 0 14px;background:var(--line)}.export-label{margin:0;color:#756c5f;font-size:11px;font-weight:750}.export-hint{margin:5px 0 0;color:#aaa193;font-size:10px;line-height:1.65}.export-button{width:100%;margin-top:11px;padding:10px 12px;border:1px solid #e6dac5;border-radius:11px;background:#fff8e8;color:#6b604d;font:700 12px/1 inherit;cursor:pointer}.diary-undo{position:fixed;right:20px;bottom:20px;z-index:5100;display:flex;align-items:center;gap:13px;padding:11px 12px 11px 15px;border-radius:13px;background:#4b4339f2;color:#fff;font-size:12px;box-shadow:0 12px 34px #4b433933;opacity:0;transform:translateY(12px);pointer-events:none;transition:.18s}.diary-undo.show{opacity:1;transform:none;pointer-events:auto}.diary-undo button{padding:7px 10px;border:0;border-radius:8px;background:#fff2c9;color:#705d38;font:inherit;font-size:11px;font-weight:800;cursor:pointer}.export-modal{position:fixed;inset:0;z-index:5200;display:none;place-items:center;padding:20px;background:#40382c55}.export-modal.show{display:grid}.export-panel{width:min(100%,430px);padding:24px;border-radius:20px;background:#fffdf8;box-shadow:0 24px 70px #332b1f38}.export-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.export-head h2{margin:0;font-size:20px}.export-close{width:32px;height:32px;border:0;border-radius:9px;background:#f3ecdf;color:#786f61;font-size:18px;cursor:pointer}.export-copy{margin:0 0 18px;color:var(--sub);font-size:12px;line-height:1.7}.export-mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:16px;padding:4px;border-radius:12px;background:#f2ebdf}.export-mode label{cursor:pointer}.export-mode input{position:absolute;opacity:0}.export-mode span{display:grid;place-items:center;min-height:36px;border-radius:9px;color:#9a9184;font-size:11px;font-weight:750}.export-mode input:checked+span{background:#fffdf8;color:#5f574c;box-shadow:0 2px 9px #55483015}.export-dates{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:9px}.export-dates label{display:grid;gap:6px;color:#8a8173;font-size:11px;font-weight:700}.export-dates input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit}.export-run{width:100%;margin-top:19px;padding:12px;border:0;border-radius:11px;background:#514c43;color:#fff;font:700 13px/1 inherit;cursor:pointer}.export-error{min-height:18px;margin:9px 0 0;color:#b46868;font-size:11px}
    @media(max-width:760px){.layout{grid-template-columns:1fr}.top{grid-template-columns:1fr}.nav{justify-self:start}.diary{padding:22px}.editor{min-height:230px}}
  </style>
<style>.export-hint{display:none!important}</style></head>
<body>
  <main class="app">
    <header class="top"><h1 class="title">日記</h1><div></div><nav class="nav"><a href="task_manager.html">タスク</a><a href="study_time.html">学習時間</a><a href="reports.html">振り返り</a></nav></header>
    <section class="layout">
      <article class="diary">
        <div class="date-row"><button id="prevDay" class="date-btn">‹</button><div><div id="dateTitle" class="date-title"></div><div id="dateSub" class="date-sub"></div></div><div class="date-actions"><button id="deleteDiary" class="delete-diary" aria-label="この日の日記を削除" title="削除">🗑</button><button id="nextDay" class="date-btn">›</button></div></div>
        <span class="section-label">今日の感情</span><div id="moods" class="moods"></div>
        <span class="section-label">今日の点数</span><div id="scorePicker" class="score-picker" aria-label="今日の点数を5点満点で選択"></div>
        <span class="section-label">今日のこと</span><textarea id="entry" class="editor" placeholder="今日あったこと、感じたことを自由に書いてみよう"></textarea>
        <div class="save-row"><span id="saved" class="saved"></span><button id="save" class="save">日記を保存</button></div><div id="diaryCheer" class="diary-cheer">今日も1日お疲れ様！ 🌼</div>
      </article>
      <aside class="side"><section class="card"><h2 class="card-title">今月の気分</h2><div class="month-nav"><button id="prevMonth">‹</button><span id="monthTitle"></span><button id="nextMonth">›</button></div><div class="week"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div><div id="calendar" class="calendar"></div></section><section class="card"><h2 class="card-title">日記について</h2><p class="hint">気分をひとつ選んで、その日のことを自由に残せます。カレンダーの色付きの日を押すと、過去の日記を開けます。</p><div class="export-divider"></div><p class="export-label">日記を手元に残す</p><button id="openExport" class="export-button" type="button">日記をPDFに書き出す</button></section></aside>
    </section>
  </main><div id="diaryUndo" class="diary-undo"><span>日記を削除しました</span><button type="button">元に戻す</button></div><div id="exportModal" class="export-modal" aria-hidden="true"><section class="export-panel" role="dialog" aria-modal="true" aria-labelledby="exportTitle"><div class="export-head"><h2 id="exportTitle">日記を書き出す</h2><button id="closeExport" class="export-close" type="button" aria-label="閉じる">×</button></div><p class="export-copy">画面の日記ページに近い見た目で、PDFとして保存できます。</p><div class="export-mode"><label><input type="radio" name="exportMode" value="one"><span>1日 / ページ</span></label><label><input type="radio" name="exportMode" value="four" checked><span>4日 / ページ</span></label></div><div class="export-dates"><label>開始日<input id="exportStart" type="date"></label><span>〜</span><label>終了日<input id="exportEnd" type="date"></label></div><p id="exportError" class="export-error"></p><button id="runExport" class="export-run" type="button">PDF書き出し画面を開く</button></section></div>
  <script>
if(!localStorage.getItem('michikusa-public-blank-v1')){['kanban-tasks-v2','kanban-categories-v1','kanban-reports-v1','study-plus-local-v1','habit-tracker-v1','habit-weekly-order-v1','habit-mini-order-v1'].forEach(k=>localStorage.removeItem(k));localStorage.setItem('michikusa-public-blank-v1','1')}
    const key='mooda-diary-local-v1';
    const data=JSON.parse(localStorage.getItem(key)||'{}');
    const moods=[
      {id:'happy',label:'うれしい',color:'#f3b6c5',kind:'happy',blush:true},
      {id:'good',label:'たのしい',color:'#f4cf69',kind:'spark',blush:true},
      {id:'calm',label:'おだやか',color:'#a7d89b',kind:'calm'},
      {id:'plain',label:'ふつう',color:'#d8d4cc',kind:'plain'},
      {id:'sad',label:'かなしい',color:'#9baec9',kind:'sad'},
      {id:'worried',label:'イライラ',color:'#e8a3a3',kind:'angry'}
    ];
    const $=id=>document.getElementById(id);let current=new Date(),month=new Date(current.getFullYear(),current.getMonth(),1),selected='',selectedScore=0;
    function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
    function resize(){const e=$('entry');e.style.height='auto';e.style.height=Math.max(270,e.scrollHeight)+'px'}
    function face(m){return '<span class="eye left"></span><span class="eye right"></span><span class="mouth"></span>'+(m.blush?'<span class="blush left"></span><span class="blush right"></span>':'')}
    function renderMoods(){if(!selected)selected=(data[iso(current)]||{}).mood||'happy';$('moods').innerHTML=moods.map(m=>'<div class="mood-choice"><button class="mood '+m.kind+(m.id===selected?' selected':'')+'" aria-label="'+m.label+'" data-mood="'+m.id+'" style="background:'+m.color+'">'+face(m)+'</button><span class="mood-name">'+m.label+'</span></div>').join('');document.querySelectorAll('#moods button[data-mood]').forEach(b=>b.onclick=()=>{selected=b.dataset.mood;renderMoods()})}
    function renderScore(){const colors=['#e4f2f8','#def1e8','#e8f2d8','#faedcf','#f8e2e9'];$('scorePicker').innerHTML=colors.map((color,i)=>'<button class="score-btn'+(selectedScore===i+1?' selected':'')+'" data-score="'+(i+1)+'" style="--score-bg:'+color+'" aria-label="'+(i+1)+'点">'+(i+1)+'</button>').join('')+'<span class="score-caption">5点満点</span>';document.querySelectorAll('.score-btn').forEach(b=>b.onclick=()=>{selectedScore=Number(b.dataset.score);renderScore()})}
    function hasEntry(entry){return !!(entry&&entry.savedAt)}
    function renderDiary(){const entry=data[iso(current)]||{},saved=hasEntry(entry);$('dateTitle').textContent=current.toLocaleDateString('ja-JP',{month:'long',day:'numeric'});$('dateSub').textContent=current.toLocaleDateString('ja-JP',{weekday:'long'});$('entry').value=entry.text||'';selected=entry.mood||'happy';selectedScore=Number(entry.score)||0;$('save').textContent=saved?'日記を更新':'日記を保存';$('deleteDiary').classList.toggle('show',saved);renderMoods();renderScore();resize()}
    function calendarFace(mood){return '<span class="calendar-face-wrap"><span class="mood '+mood.kind+'" style="background:'+mood.color+'">'+face(mood)+'</span></span>'}
    function renderCalendar(){const y=month.getFullYear(),m=month.getMonth(),last=new Date(y,m+1,0),offset=(new Date(y,m,1).getDay()+6)%7;$('monthTitle').textContent=y+'年 '+(m+1)+'月';$('calendar').innerHTML='';for(let i=0;i<offset;i++)$('calendar').append(document.createElement('span'));for(let day=1;day<=last.getDate();day++){const d=new Date(y,m,day),k=iso(d),entry=data[k]||{},b=document.createElement('button'),mood=moods.find(x=>x.id===entry.mood),saved=hasEntry(entry);b.className='day'+(k===iso(new Date())?' today':'')+(saved?' has-entry':'');b.innerHTML='<span class="day-number">'+day+'</span>'+(saved&&mood?calendarFace(mood):'');b.title=(m+1)+'月'+day+'日'+(saved?'の日記を開く':'');b.onclick=()=>{current=d;month=new Date(y,m,1);renderDiary();renderCalendar();document.querySelector('.diary').scrollIntoView({behavior:'smooth',block:'start'})};$('calendar').append(b)}}
    function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
    function openExportModal(){const savedDates=Object.keys(data).filter(k=>hasEntry(data[k])).sort(),today=iso(new Date()),first=savedDates[0]||today,last=savedDates[savedDates.length-1]||today;$('exportStart').value=first;$('exportEnd').value=last;$('exportError').textContent='';$('exportModal').classList.add('show');$('exportModal').setAttribute('aria-hidden','false')}
    function closeExportModal(){$('exportModal').classList.remove('show');$('exportModal').setAttribute('aria-hidden','true')}
    function mondayKey(dateKey){const d=new Date(dateKey+'T00:00:00'),offset=(d.getDay()+6)%7;d.setDate(d.getDate()-offset);return iso(d)}
    function exportDiary(){
      const start=$('exportStart').value,end=$('exportEnd').value,mode=document.querySelector('input[name="exportMode"]:checked').value;
      if(!start||!end||start>end){$('exportError').textContent='開始日と終了日を正しく指定してください。';return}
      const entries=Object.keys(data).filter(k=>k>=start&&k<=end&&hasEntry(data[k])).sort().map(k=>({date:k,...data[k]}));
      if(!entries.length){$('exportError').textContent='指定期間に保存済みの日記がありません。';return}
      const pages=[];
      const perPage=mode==='one'?1:4;
      for(let i=0;i<entries.length;i+=perPage)pages.push({items:entries.slice(i,i+perPage)});
      const moodLabel=id=>(moods.find(m=>m.id===id)||{}).label||'未選択';
      const cards=pages.map(page=>{
        const pageClass=mode==='one'?'single':'four';
        return '<section class="page '+pageClass+'">'+page.items.map(item=>{
          const d=new Date(item.date+'T00:00:00'),date=d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
          return '<article class="entry"><header><h2>'+escapeHtml(date)+'</h2><div><span>'+escapeHtml(moodLabel(item.mood))+'</span><b>'+(item.score?escapeHtml(item.score)+' / 5':'点数なし')+'</b></div></header><p>'+escapeHtml(item.text).replace(/\n/g,'<br>')+'</p></article>';
        }).join('')+'</section>';
      }).join('');
      const popup=window.open('','_blank');
      if(!popup){$('exportError').textContent='書き出し画面を開けませんでした。ポップアップを許可してください。';return}
      popup.document.write('<!doctype html><html lang="ja"><head><meta charset="UTF-8"><title>日記 '+escapeHtml(start)+'〜'+escapeHtml(end)+'</title><style>@page{size:A4;margin:12mm}*{box-sizing:border-box}body{margin:0;color:#403b34;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.page{height:273mm;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:4mm;break-after:page}.page.weekly{grid-template-rows:auto repeat(7,minmax(0,1fr));gap:2.5mm}.page:last-child{break-after:auto}.week-title{margin:0 0 1mm;font-size:15pt}.entry{padding:5mm 6mm;border:1px solid #eadfca;border-radius:4mm;background:#fffdf8;overflow:hidden}.weekly .entry{padding:3mm 4mm}.entry header{display:flex;align-items:center;justify-content:space-between;gap:8mm;padding-bottom:3mm;border-bottom:1px solid #eee5d6}.weekly .entry header{padding-bottom:1.5mm}.entry h2{margin:0;font-size:13pt}.weekly .entry h2{font-size:10pt}.entry header div{display:flex;gap:3mm;color:#766d60;font-size:9pt}.entry header span,.entry header b{padding:1.5mm 3mm;border-radius:999px;background:#f5eddf}.entry p{margin:4mm 0 0;font-size:10.5pt;line-height:1.65;white-space:normal}.weekly .entry p{margin-top:2mm;font-size:8.5pt;line-height:1.45}@media screen{body{padding:20px;background:#eee}.page{width:210mm;margin:0 auto 20px;padding:12mm;background:white;box-shadow:0 8px 30px #0002}}@media print{.page{padding:0}}</style></head><body>'+cards+'<script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>');
      popup.document.close();closeExportModal();
    }
    $('save').onclick=()=>{data[iso(current)]={text:$('entry').value.trim(),mood:selected,score:selectedScore,savedAt:Date.now()};localStorage.setItem(key,JSON.stringify(data));$('saved').textContent='保存しました';const sound=new Audio('diary-save-sound.wav');sound.volume=.7;sound.play().catch(()=>{});const cheer=$('diaryCheer');cheer.classList.remove('show');void cheer.offsetWidth;cheer.classList.add('show');renderCalendar();setTimeout(()=>{$('saved').textContent='';cheer.classList.remove('show')},2600)};

      exportDiary=function(){const start=$('exportStart').value,end=$('exportEnd').value,mode=document.querySelector('input[name="exportMode"]:checked').value;if(!start||!end||start>end){$('exportError').textContent='開始日と終了日を正しく指定してください。';return}const entries=Object.keys(data).filter(k=>k>=start&&k<=end&&hasEntry(data[k])).sort().map(k=>({date:k,...data[k]}));if(!entries.length){$('exportError').textContent='指定期間に保存済みの日記がありません。';return}const groups=[];for(let i=0;i<entries.length;i+=mode==='one'?1:4)groups.push(entries.slice(i,i+(mode==='one'?1:4)));const shot=item=>{const d=new Date(item.date+'T00:00:00'),m=moods.find(x=>x.id===item.mood)||moods[0],score=Number(item.score)||0;return '<article class="diary-shot"><div class="shot-date"><b>'+escapeHtml(d.toLocaleDateString('ja-JP',{month:'long',day:'numeric'}))+'</b><span>'+escapeHtml(d.toLocaleDateString('ja-JP',{weekday:'long'}))+'</span></div><div class="shot-section">今日の感情</div><div class="shot-mood">'+printFace(m)+'</div><div class="shot-section">今日の点数</div><div class="shot-score">'+[1,2,3,4,5].map(n=>'<i class="'+(score===n?'picked':'')+'">'+n+'</i>').join('')+'</div><div class="shot-section">今日のこと</div><div class="shot-entry">'+escapeHtml(item.text).replace(/\n/g,'<br>')+'</div></article>'};const pages=groups.map(group=>'<section class="pdf-page '+(mode==='one'?'single':'four')+'">'+group.map(shot).join('')+'</section>').join('');const popup=window.open('','_blank');if(!popup){$('exportError').textContent='書き出し画面を開けませんでした。ポップアップを許可してください。';return}popup.document.write('<!doctype html><html lang="ja"><head><meta charset="UTF-8"><title>日記 '+escapeHtml(start)+'〜'+escapeHtml(end)+'</title><style>@page{size:A4;margin:10mm}*{box-sizing:border-box}body{margin:0;background:#eee;color:#413d36;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.pdf-page{width:190mm;height:277mm;margin:0 auto 10mm;padding:8mm;background:#fbf7ee;display:grid;gap:6mm;break-after:page}.pdf-page:last-child{break-after:auto}.pdf-page.single{grid-template-columns:1fr}.pdf-page.four{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.diary-shot{min-height:0;padding:7mm;border-radius:7mm;background-color:#fffdf8;background-image:radial-gradient(#e9dfcf 1px,transparent 1px);background-size:5mm 5mm;box-shadow:0 4mm 10mm #50463212;overflow:hidden}.shot-date{text-align:center;padding-bottom:4mm;border-bottom:1px solid #ece3d3}.shot-date b{display:block;font-size:16pt}.shot-date span{display:block;margin-top:1mm;color:#9b9385;font-size:8pt}.shot-section{margin-top:4mm;color:#8f8778;font-size:7pt;font-weight:800;letter-spacing:.05em}.shot-mood{margin-top:2mm}.shot-face{position:relative;display:block;width:22mm;height:22mm;border-radius:50%;box-shadow:0 1.5mm 0 #695d3a19}.shot-face i{position:absolute;display:block}.shot-face .eye{top:8mm;width:2mm;height:2.8mm;border-radius:50%;background:#554d44}.shot-face .eye.left{left:6.8mm}.shot-face .eye.right{right:6.8mm}.shot-face .mouth{left:50%;top:12.5mm;width:6mm;height:3.5mm;transform:translateX(-50%);border:1mm solid #554d44;border-top:0;border-radius:0 0 6mm 6mm}.shot-face.calm .eye{height:.8mm;top:9.5mm}.shot-face.plain .mouth{top:14mm;height:0;border-width:0 0 1mm;border-radius:0}.shot-face.sad .mouth,.shot-face.angry .mouth{top:14mm;border-width:1mm 1mm 0;border-radius:6mm 6mm 0 0}.shot-face.angry .eye{top:9mm;width:3mm;height:.8mm}.shot-face.spark .mouth{top:12mm;height:4mm;background:#554d44;border:0}.shot-face .blush{top:12mm;width:3mm;height:1.3mm;border-radius:50%;background:#e78f91aa}.shot-face .blush.left{left:3mm}.shot-face .blush.right{right:3mm}.shot-score{display:flex;gap:2mm;margin-top:2mm}.shot-score i{display:grid;place-items:center;width:8mm;height:8mm;border-radius:3mm;background:#f1eee8;color:#9a9387;font-style:normal;font-size:8pt}.shot-score i.picked{background:#f8e2e9;color:#655d50;box-shadow:0 0 0 1mm #fff,0 0 0 1.5mm #e2bd52}.shot-entry{min-height:45mm;margin-top:2mm;padding:4mm;border:1px solid #ece3d3;border-radius:4mm;background:#fffefa;font-size:9pt;line-height:1.75;overflow:hidden}.four .diary-shot{padding:4.5mm;border-radius:5mm}.four .shot-date{padding-bottom:2mm}.four .shot-date b{font-size:11pt}.four .shot-section{margin-top:2.5mm;font-size:6pt}.four .shot-face{width:14mm;height:14mm}.four .shot-face .eye{top:5mm;width:1.3mm;height:1.8mm}.four .shot-face .eye.left{left:4.3mm}.four .shot-face .eye.right{right:4.3mm}.four .shot-face .mouth{top:8mm;width:4mm;height:2.3mm;border-width:.6mm}.four .shot-face .blush{top:8mm;width:2mm;height:.9mm}.four .shot-face .blush.left{left:2mm}.four .shot-face .blush.right{right:2mm}.four .shot-score i{width:6mm;height:6mm;font-size:6pt;border-radius:2mm}.four .shot-entry{min-height:0;height:44mm;padding:3mm;font-size:7pt;line-height:1.55}@media screen{body{padding:10mm}.pdf-page{box-shadow:0 3mm 11mm #0002}}@media print{body{background:#fff}.pdf-page{margin:0;padding:8mm;box-shadow:none}}</style></head><body>'+pages+'<script>window.onload=()=>setTimeout(()=>window.print(),250)<\\/script></body></html>');popup.document.close();closeExportModal()};$('runExport').onclick=exportDiary;
