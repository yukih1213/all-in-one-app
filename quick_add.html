<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4fbfe">
  <title>タスク追加</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#24343b;background:#f4fbfe}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f2fbfe,#fbfaf5);padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
    main{width:min(100%,520px);margin:0 auto;padding:34px 0 28px}.eyebrow{margin:0 0 8px;color:#7b9aa5;font-size:12px;font-weight:700;letter-spacing:.12em}.title{margin:0;font-size:34px;letter-spacing:-.05em}.copy{margin:10px 0 24px;color:#78909a;font-size:13px;line-height:1.7}
    form{display:grid;gap:12px;padding:18px;border-radius:24px;background:#fff;box-shadow:0 16px 42px #477f9918}.field{display:grid;gap:7px;color:#6c858e;font-size:12px;font-weight:700}.input,.select{width:100%;padding:14px;border:1px solid #dcecf1;border-radius:14px;background:#fbfeff;color:#24343b;font:inherit;font-size:16px;outline:none}.input:focus,.select:focus{border-color:#91cfe2;box-shadow:0 0 0 4px #bfeaf533}.add{margin-top:4px;padding:15px;border:0;border-radius:15px;background:#67b8d2;color:white;font:700 15px/1 inherit;cursor:pointer}.add:active{transform:scale(.98)}.back{display:block;margin:18px auto 0;color:#71909b;text-align:center;text-decoration:none;font-size:12px}.done{display:none;margin-top:18px;padding:14px;border-radius:14px;background:#e5f7ed;color:#4d8b68;text-align:center;font-size:13px}.done.show{display:block}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">QUICK CAPTURE</p>
    <h1 class="title">タスクを追加</h1>
    <p class="copy">思いついたことをすぐにメモ。追加したタスクは自動でインボックスに入ります。</p>
    <form id="quickForm">
      <label class="field">タスク名<input id="title" class="input" maxlength="100" autocomplete="off" placeholder="例：企業説明会を調べる" required autofocus></label>
      <label class="field">属性<select id="category" class="select"></select></label>
      <label class="field">締切（任意）<input id="due" class="input" type="date"></label>
      <button class="add" type="submit">インボックスに追加</button>
    </form>
    <div id="done" class="done">インボックスに追加しました ✓</div>
    <a class="back" href="index.html">タスク一覧へ戻る</a>
  </main>
  <script>
    const storage='kanban-tasks-v2',customKey='kanban-categories-v1';
    const category=document.getElementById('category'),form=document.getElementById('quickForm'),done=document.getElementById('done');
    const custom=JSON.parse(localStorage.getItem(customKey)||'[]');
    const options=[['school','学校'],['career','就職活動'],['private','プライベート'],['other','その他'],...custom];
    category.innerHTML=options.map(([id,label])=>'<option value="'+id+'">'+label+'</option>').join('');
    form.addEventListener('submit',e=>{e.preventDefault();const title=document.getElementById('title').value.trim();if(!title)return;const tasks=JSON.parse(localStorage.getItem(storage)||'[]');tasks.push({id:Date.now(),title,lane:'inbox',category:category.value,priority:'medium',due:document.getElementById('due').value,done:false,spent:0,running:false,started:0});localStorage.setItem(storage,JSON.stringify(tasks));form.reset();category.value='other';done.classList.add('show');setTimeout(()=>done.classList.remove('show'),2200);document.getElementById('title').focus()});
  </script>
</body>
</html>
